name: release

# Triggered on `v*` tag pushes. Before goreleaser publishes binaries,
# the per-agent self-check (#375) is invoked via the reusable workflow
# at .github/workflows/self-check-daily.yml (#534). goreleaser declares
# `needs: self-check`, so a regression in the per-agent tool-allowlist
# contract fails closed: the tag remains in the repo, no GitHub Release
# is created, no binaries publish, no homebrew formula push fires.
# Recovery: delete the tag, fix the regression on main, retag.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  self-check:
    # Per-agent self-check gate (#534). Invokes the same workflow body
    # that runs daily on cron, so the steps stay in sync across both
    # call sites. `secrets: inherit` passes ANTHROPIC_API_KEY (required
    # by the self-check) and DISCORD_WEBHOOK_URL (used by the
    # notify-failure job in the called workflow on failure).
    uses: ./.github/workflows/self-check-daily.yml
    secrets: inherit

  goreleaser:
    needs: self-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.x'

      # Materialize the checksums-signing private key from the repo secret
      # into an ephemeral file under the runner temp dir (destroyed with the
      # job). goreleaser's `signs:` block reads it via PYRY_SIGNING_KEY_FILE.
      # PYRY_RELEASE_SIGNING_KEY is a distinct secret from HOMEBREW_TAP_TOKEN
      # and must have tighter custody than the release-publishing capability.
      # See docs/release-tooling.md.
      - name: Materialize signing key
        run: |
          install -m 600 /dev/null "${RUNNER_TEMP}/pyry-signing-key.pem"
          printf '%s' "${PYRY_RELEASE_SIGNING_KEY}" > "${RUNNER_TEMP}/pyry-signing-key.pem"
        env:
          PYRY_RELEASE_SIGNING_KEY: ${{ secrets.PYRY_RELEASE_SIGNING_KEY }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with `repo` scope for pushing the auto-generated formula
          # to pyrycode/homebrew-tap. Create as a repo secret on
          # pyrycode/pyrycode. See docs/release-tooling.md for setup.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # Path to the Ed25519 private key that signs checksums.txt. The
          # matching public key is baked into the binary. See
          # docs/release-tooling.md.
          PYRY_SIGNING_KEY_FILE: ${{ runner.temp }}/pyry-signing-key.pem
